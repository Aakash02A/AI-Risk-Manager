server:
  port: 8080

spring:
  application:
    name: chargeback-evidence-responder
  jackson:
    property-naming-strategy: SNAKE_CASE
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/chargeback_responder?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:your_mysql_password}
    driver-class-name: ${MYSQL_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:5000}
  thresholds:
    weak: ${WEAK_THRESHOLD:0.40}
    strong: ${STRONG_THRESHOLD:0.70}
  llm:
    api-key: ${GEMINI_API_KEY:}
    model: ${LLM_MODEL:gemini-3.8-flash}

logging:
  level:
    com.chargeback.responder: INFO

server:
  port: 8080

spring:
  application:
    name: chargeback-evidence-responder
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${MYSQL_URL:jdbc:h2:mem:chargeback_responder;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${MYSQL_USERNAME:sa}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: ${MYSQL_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:5000}
  thresholds:
    weak: ${WEAK_THRESHOLD:0.40}
    strong: ${STRONG_THRESHOLD:0.70}
  llm:
    api-key: ${GEMINI_API_KEY:}
    model: ${LLM_MODEL:gemini-3.8-flash}

logging:
  level:
    com.chargeback.responder: INFO
